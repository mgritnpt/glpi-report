version: '3.8'

services:
  glpi-reports:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glpi-reports-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=192.168.1.100
      - DB_PORT=3306
      - DB_USER=glpiuser
      - DB_PASSWORD=glpipassword
      - DB_NAME=glpidb
      - NODE_ENV=production
    dns:
      - 192.168.1.102
